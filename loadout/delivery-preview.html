<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="version" content="0.1.0">
<title>Loadout delivery preview v0.1.0</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" onerror="window.__threeFailed=true"></script>
<style>
/* Preview page only. The cutscene injects its own dlv- styles so it can be lifted into the app. */
:root{--pv-bg:#10151f;--pv-btn:#222b3a;--pv-btn-on:#1e6fd9;--pv-text:#e8edf4;--pv-muted:#aab4c3;--pv-edge:#6b7a90;--pv-focus:#8cbcff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--pv-bg);color:var(--pv-text);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif}
main{min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#stage{position:relative;background:#0b0f16;border:1px solid #2b3546;border-radius:8px;overflow:hidden;max-width:100%}
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:center;align-items:center;max-width:100%}
.seg{display:flex;gap:0}
.seg button{border-radius:0}
.seg button:first-child{border-radius:8px 0 0 8px}
.seg button:last-child{border-radius:0 8px 8px 0}
.seg button+button{border-left:0}
.controls button{min-height:44px;min-width:44px;padding:0 16px;background:var(--pv-btn);color:var(--pv-text);border:1px solid var(--pv-edge);border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
.controls button[aria-pressed="true"]{background:var(--pv-btn-on);border-color:var(--pv-btn-on);color:#fff}
.controls button:focus-visible{outline:3px solid var(--pv-focus);outline-offset:2px;position:relative;z-index:1}
#status{margin:0;color:var(--pv-muted);font-size:14px;min-height:20px;text-align:center}
.ver{color:var(--pv-muted);font-size:13px;margin:0}
body.freeze main{padding:0;gap:0}
body.freeze .controls,body.freeze #status,body.freeze .ver{display:none}
body.freeze #stage{position:fixed;inset:0;width:100vw!important;height:100vh!important;border:0;border-radius:0}
</style>
</head>
<body>
<main>
  <h1 class="sr">Loadout delivery cutscene preview</h1>
  <div id="stage"></div>
  <div class="controls">
    <button type="button" id="btnPlay">Play again</button>
    <button type="button" id="btnBanner">Banner only</button>
    <div class="seg" role="group" aria-label="Frame size">
      <button type="button" data-size="phone" aria-pressed="false">Phone</button>
      <button type="button" data-size="land" aria-pressed="false">Landscape</button>
      <button type="button" data-size="desk" aria-pressed="true">Desktop</button>
    </div>
    <div class="seg" role="group" aria-label="Playback speed">
      <button type="button" data-speed="1" aria-pressed="true">1x</button>
      <button type="button" data-speed="0.5" aria-pressed="false">0.5x</button>
    </div>
  </div>
  <p id="status" aria-live="polite"></p>
  <p class="ver">Preview v0.1.0. Tap the scene, or press Esc, Enter or Space, to skip.</p>
</main>

<script>
/* ===== Delivery cutscene: playDelivery(container, { job, client, onDone }) -> { skip() } ===== */

  var HX = -150, HZ = 250; // where the house street sits, far outside the shop's fog range

    ink: '#1a2233', accent: '#1e6fd9', deliver: '#166b3e', umbBlue: '#1A9BE8', umbInk: '#1a1f2b',

    '<path d="' + MARK_PATHS.lid + '" stroke-width="5" stroke-linecap="round"/><path d="M8 35h48" stroke-width="4"/>' +

    '.dlv-root canvas{position:absolute;inset:0;width:100%;height:100%;display:block}',

    '.dlv-flat .dlv-banner{top:50%;opacity:1;transform:translateY(-50%) rotate(-3deg)}',

    '.dlv-band svg{flex:none;width:min(14cqw,19cqh,112px);height:min(14cqw,19cqh,112px)}',

    '.dlv-word{font-family:"Segoe UI Black","Arial Black","Helvetica Neue",system-ui,sans-serif;font-weight:900;font-size:min(11.5cqw,16cqh,124px);line-height:1;letter-spacing:-.01em;color:#166b3e;',
    'text-shadow:-2px -2px 0 #0b2a18,2px -2px 0 #0b2a18,-2px 2px 0 #0b2a18,2px 2px 0 #0b2a18,0 -2px 0 #0b2a18,0 2px 0 #0b2a18,-2px 0 0 #0b2a18,2px 0 0 #0b2a18,5px 6px 0 #b8d8c4}',

  function jobLine(o) { return 'Job ' + clean(o.job, '1042') + ', ' + clean(o.client, 'Lakeview Dental'); }

  function ensureCss() {

    document.head.appendChild(el); return el;

  function buildBanner(root, line) {

    sr.textContent = 'Delivered. ' + line; root.appendChild(sr);
    var b = document.createElement('div'); b.className = 'dlv-banner'; b.setAttribute('aria-hidden', 'true');

    b.querySelector('.dlv-job').textContent = line;
    root.appendChild(b);
    var skip = document.createElement('button'); skip.type = 'button'; skip.className = 'dlv-skip';

    container.appendChild(root);
    var shell = { root: root, banner: parts.banner, skipBtn: parts.skipBtn, done: false, timers: [], cleanups: [] };
    function on(target, type, fn, o) {
      target.addEventListener(type, fn, o); live.listeners++;

      shell.timers.forEach(clearTimeout);
      if (teardownExtra) teardownExtra();

      if (root.parentNode) root.parentNode.removeChild(root);
      if (css && css.parentNode) css.parentNode.removeChild(css);
      live.instances--;
      if (!silent && typeof opts.onDone === 'function') opts.onDone({ reason: reason });
    };
    live.instances++;

  }

  function bindSkip(shell, fn) {
    shell.on(shell.root, 'pointerdown', function (e) { if (e.button === 0 || e.pointerType !== 'mouse') { e.preventDefault(); fn(); } });

  /* ---------- Fallback: the banner alone, still, dismissible ---------- */
  function playFallback(container, opts, why) {

    shell.root.setAttribute('data-mode', 'fallback-' + why);

  }

  }

    bx(mg, 6.85, 7.0, 0.04, 0.06, -220, 5, C.paint);
    bx(mg, 6.85, 7.0, 0.04, 0.06, 13, 35, C.paint);
    bx(mg, 6.85, 7.0, 0.04, 0.06, 44, 220, C.paint);
    // parked cars as plain blocks
    var cars = [[-9.6, -1.2, 0, 0xb03a2e], [-9.6, -4.4, 0, 0xd9dcdf], [-9.6, -10.8, 0, 0x2e5d9a], [-9.6, -14, 0, 0x2d2f33],
      [-9.6, -20.4, 0, 0x8e969e], [1.6, -4.4, Math.PI, 0xc9a227], [1.6, -10.8, Math.PI, 0x3e6b48], [1.6, -20.4, Math.PI, 0xe1e3e5]];

    var i;
    for (i = 0; i < 64; i++) tree(mg, 32 + rnd() * 5, -170 + i * 3.6 + rnd() * 2, 1.1 + rnd() * 0.7, rnd() < 0.3);

        var e = outBack(p);
        bn.style.opacity = String(Math.min(1, p * 3));
        bn.style.transform = 'scale(' + (1.9 - 0.9 * e).toFixed(4) + ') rotate(' + (-3 - 6 * (1 - out3(p))).toFixed(3) + 'deg)';
      }
      var sh = t - T_LAND, cv = renderer.domElement;
      cv.style.transform = (sh > 0 && sh < 0.28) ? 'translate(' + (Math.sin(sh * 70) * 5 * (1 - sh / 0.28)).toFixed(2) + 'px,' + (Math.cos(sh * 55) * 4 * (1 - sh / 0.28)).toFixed(2) + 'px)' : '';
      root.style.opacity = t > T_HOLD ? String(1 - clamp01((t - T_HOLD) / T_FADE)) : '1';
    }

    function resize() {
      var w = Math.max(1, root.clientWidth), hh = Math.max(1, root.clientHeight);
      aspect = w / hh; renderer.setSize(w, hh, false);
    }
    resize();
    var ro = window.ResizeObserver ? new ResizeObserver(function () { resize(); if (frozen) { apply(startT); renderer.render(scene, camera); } }) : null;
    if (ro) ro.observe(root); else shell.on(window, 'resize', resize);

    var speed = opts.speed > 0 ? opts.speed : 1, startT = opts.t > 0 ? +opts.t : 0, frozen = !!opts.freeze;
    var raf = 0, t0 = performance.now(), frames = 0, statT0 = 0;
    function teardown() {
      cancelAnimationFrame(raf);
      if (ro) ro.disconnect();
      window.__dlvInfo = { calls: renderer.info.render.calls, triangles: renderer.info.render.triangles, geometries: renderer.info.memory.geometries, textures: renderer.info.memory.textures, frames: frames, fps: statT0 ? Math.round(frames / ((performance.now() - statT0) / 1000)) : 0 };
      track.geo.forEach(function (g) { g.dispose(); });
      track.mat.forEach(function (m) { m.dispose(); });
      track.tex.forEach(function (x) { x.dispose(); });
      var gl = renderer.getContext();
      renderer.dispose(); if (gl && !gl.isContextLost()) renderer.forceContextLoss();
      scene = camera = null;
    }
    function skip() {
      if (shell.done || shell.skipping) return;
      if (frozen) { shell.finish('skip', teardown); return; }
      shell.skipping = true; cancelAnimationFrame(raf);
      root.style.transition = 'opacity .18s ease-out'; root.style.opacity = '0';
      shell.timers.push(setTimeout(function () { shell.finish('skip', teardown); }, 190));
    }
    bindSkip(shell, skip);
    var handle = { skip: skip };
    // if the GPU drops the context mid-scene, swap to the still banner instead of leaving a blank frame
    shell.on(renderer.domElement, 'webglcontextlost', function (e) {
      e.preventDefault();
      if (shell.done) return;
      shell.finish('context-lost', teardown, true);
      handle.skip = playFallback(container, opts, 'context-lost').skip;
    });

    function loop(now) {
      if (shell.done) return;
      var t = startT + (now - t0) / 1000 * speed;
      apply(t); renderer.render(scene, camera);
      if (!statT0) statT0 = now; frames++;
      if (t >= T_HOLD + T_FADE) { shell.finish('done', teardown); return; }
      raf = requestAnimationFrame(loop);
    }
    if (frozen) {
      apply(startT); renderer.render(scene, camera);
      window.__dlvInfoLive = { calls: renderer.info.render.calls, triangles: renderer.info.render.triangles };
      window.__deliveryReady = true;
    } else raf = requestAnimationFrame(loop);
    return { skip: function () { handle.skip(); } };
  }

  window.playDelivery = playDelivery;
})();

/* ===== Preview page wiring ===== */
(function () {
  'use strict';
  var q = new URLSearchParams(location.search);
  var stage = document.getElementById('stage'), status = document.getElementById('status');
  var SIZES = { phone: [390, 844], land: [844, 390], desk: [1280, 720] };
  var size = 'desk', speed = 1, cur = null;
  var freeze = q.get('freeze') === '1';
  if (freeze) document.body.classList.add('freeze');

  function fit() {
    if (freeze) return;
    var s = SIZES[size], availW = document.documentElement.clientWidth - 32, availH = window.innerHeight - 190;
    var k = Math.min(1, availW / s[0], Math.max(0.3, availH / s[1]));
    stage.style.width = Math.round(s[0] * k) + 'px'; stage.style.height = Math.round(s[1] * k) + 'px';
  }
  function start(fallback) {
    if (cur) { var old = cur; cur = null; old.skip(); }
    status.textContent = fallback ? 'Showing the banner only (the reduced-motion and no-3D version).' : 'Playing at ' + speed + 'x.';
    var me = playDelivery(stage, {
      job: q.get('job'), client: q.get('client'), speed: speed, fallback: fallback,
      t: parseFloat(q.get('t')) || 0, freeze: freeze,
      onDone: function (r) { if (cur === me) { cur = null; status.textContent = 'Finished (' + r.reason + '). Press Play again to watch it again.'; } }
    });
    cur = me;
    var r = stage.querySelector('.dlv-root'), m = r && r.getAttribute('data-mode');
    if (!fallback && m) status.textContent = 'Showing the still banner (' + m.replace('fallback-', '').replace('-', ' ') + ').';
  }
  function press(groupAttr, val) {
    document.querySelectorAll('[data-' + groupAttr + ']').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-' + groupAttr) === val)); });
  }
  document.getElementById('btnPlay').addEventListener('click', function () { start(false); });
  document.getElementById('btnBanner').addEventListener('click', function () { start(true); });
  document.querySelectorAll('[data-size]').forEach(function (b) {
    b.addEventListener('click', function () { size = b.getAttribute('data-size'); press('size', size); fit(); });
  });
  document.querySelectorAll('[data-speed]').forEach(function (b) {
    b.addEventListener('click', function () { speed = parseFloat(b.getAttribute('data-speed')); press('speed', b.getAttribute('data-speed')); start(false); });
  });
  window.addEventListener('resize', fit);
  fit();
  start(q.get('fallback') === '1');
})();
</script>
